<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Quiz Result</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; text-align: center; }
        a { text-decoration: none; background-color: #007bff; color: white; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>

<h1>Quiz Completed!</h1>
<h2>Your Score:</h2>

<p style="font-size: 24px;">
    <b th:text="${score}">0</b> out of <b th:text="${totalQuestions}">0</b> correct answers.
</p>

<br/><br/>

<a th:href="@{/}">Create a New Quiz</a>

</body>
</html>
